<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Stem Studio · 브라우저 AI 분리 테스트</title>
<script src="coi-serviceworker.js"></script>
<style>
body{margin:0;background:#080a15;color:#f5f3ff;font-family:system-ui,sans-serif}
main{max-width:650px;margin:auto;padding:18px}
h1{font-size:26px;margin:6px 0}.purple{color:#c78aff}
.panel{border:1px solid #30324c;border-radius:18px;padding:16px;margin:16px 0;background:#111426}
.small{font-size:13px;color:#9fa7bd;line-height:1.6}
.warn{color:#ffce91}.ok{color:#9dff8a}.bad{color:#ff7b8a}
input[type=file]{max-width:100%;color:#ccc}
select{background:#080a15;color:#fff;border:1px solid #30324c;border-radius:8px;padding:6px}
button{border:0;border-radius:12px;padding:14px;background:#9b5df3;color:#fff;font-weight:700;font-size:16px;width:100%;margin-top:12px}
button:disabled{background:#3b3c50;color:#aaa}
button.ghost{background:transparent;border:1px solid #9b5df3;color:#c78aff;padding:10px;font-size:14px}
button.mini{width:auto;padding:8px 10px;font-size:13px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prog{height:8px;background:#22243a;border-radius:4px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:#c78aff;transition:width .3s}
#status{margin-top:10px;font-size:14px;line-height:1.6;white-space:pre-line}
.track{border:1px solid var(--c);border-radius:12px;padding:12px;margin:12px 0}
.track strong{color:var(--c)}
audio{width:100%;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px;border-bottom:1px solid #22243a;text-align:left}
pre{white-space:pre-wrap;font-size:12px;color:#c9cde0;background:#080a15;padding:10px;border-radius:10px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<main>
  <h1>✦ Stem <span class="purple">Studio</span></h1>
  <p class="small">브라우저 AI 분리 테스트 · Demucs(htdemucs) · DRUMS / BASS / INST / VOCALS<br>음악은 서버로 올라가지 않고 이 폰 안에서만 처리됩니다.</p>

  <div class="panel">
    <strong>① 기기 점검</strong>
    <div id="diag" class="small">점검 중…</div>
  </div>

  <div class="panel">
    <strong>② 원곡 선택</strong><br><br>
    <input id="file" type="file" accept="audio/*,.mp3">
    <p id="fileinfo" class="small">선택된 파일 없음</p>
    <label class="small row"><input type="checkbox" id="testMode" checked> 빠른 테스트: 30초 구간만 분리 (처음엔 이걸로 하세요)</label>
    <label class="small row">AI 엔진 <select id="engine">
      <option value="auto">자동 (WebGPU → 안 되면 CPU)</option>
      <option value="webgpu">WebGPU만</option>
      <option value="wasm">CPU(WASM)만</option>
    </select></label>
    <button id="run" disabled>AI 스템 분리 시작</button>
    <div class="prog"><i id="bar"></i></div>
    <div id="status" class="small"></div>
  </div>

  <div id="verify" class="panel" style="display:none"></div>
  <section id="tracks"></section>

  <div class="panel">
    <strong>테스트 리포트</strong>
    <p class="small">분리가 끝나거나 오류가 나면 아래 버튼으로 복사해서 Claude에게 붙여넣어 주세요.</p>
    <button id="copy" class="ghost">리포트 복사</button>
    <pre id="report"></pre>
  </div>
  <p class="small">AI 모델 파일(약 172MB)은 처음 한 번만 받고 이 폰에 저장해 둡니다. 가능하면 Wi-Fi에서 사용하세요.</p>
</main>
<script src="lib/lamejs/lame.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
